name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and test
        run: gradle --no-daemon clean build
      - name: Upload development JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rebar_Relics-development-jar
          path: build/libs/Rebar_Relics-*.jar
          if-no-files-found: error
