name: Paper 26.3 integration smoke

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile snapshot and tests
        run: gradle --no-daemon clean build
      - name: Boot disposable Paper server with Rebar and Pylon
        run: python3 .github/scripts/smoke_startup.py
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebar-relics-startup-logs
          path: |
            smoke-startup.log
            run/logs/latest.log
          if-no-files-found: warn
