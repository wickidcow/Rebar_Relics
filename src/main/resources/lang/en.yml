      <arrow> Consumes one talisman
  water_breather_talisman_1:
    name: "<green>Water Breather Talisman I"
    lore: |-
      <arrow> Prevents drowning and grants 3 min Water Breathing
      <arrow> Consumes one talisman
  lava_walker_talisman_1:
    name: "<green>Lava Walker Talisman I"
    lore: |-
      <arrow> Prevents lava damage and grants 3 min Fire Resistance
      <arrow> Consumes one talisman
  anvil_talisman_1:
    name: "<green>Anvil Talisman I"
    lore: |-
      <arrow> Repairs a worn tool before it breaks
      <arrow> Consumes one talisman
